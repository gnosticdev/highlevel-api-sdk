name: Generate and Release Types

on:
  schedule:
    - cron: '0 10 * * 1'
  workflow_dispatch:
    inputs:
      npm_version_already_published:
        description: Skip npm publish and finish a release that is already on npm
        type: boolean
        required: false
        default: false

concurrency:
  group: generate-and-release-types
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.REPO_TOKEN }}
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set up npm publishing
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up npm CLI for trusted publishing
        run: npm install --global 'npm@^11.5.1'

      - name: Generate types from HighLevel
        run: bun run generate-all

      - name: Check for generated changes
        id: generated-changes
        shell: bash
        run: |
          if [ -n "$(git status --porcelain -- schemas/v2 src/v2)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit generated changes
        if: steps.generated-changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add schemas/v2 src/v2
          git commit -m "chore: regenerate types and schemas [skip ci]"
          git push

      - name: Check for unreleased generated changes
        id: pending-release
        shell: bash
        run: |
          git fetch --tags origin
          latest_tag="$(git tag --list 'v[0-9]*' --sort=-version:refname | head -n 1)"
          if [ -z "$latest_tag" ]; then
            echo "::error::No version tag exists. Add a vX.Y.Z tag before enabling automatic releases."
            exit 1
          fi

          echo "Latest release tag: $latest_tag"
          if git diff --quiet "$latest_tag" HEAD -- schemas/v2 src/v2; then
            echo "has_pending_release=false" >> "$GITHUB_OUTPUT"
            echo "No generated changes need a release."
          else
            echo "has_pending_release=true" >> "$GITHUB_OUTPUT"
            echo "Generated changes need a release."
          fi

      - name: Verify release package
        if: steps.pending-release.outputs.has_pending_release == 'true'
        run: |
          bun test
          bun run build

      - name: Configure release commit identity
        if: steps.pending-release.outputs.has_pending_release == 'true'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish npm package and GitHub release
        if: steps.pending-release.outputs.has_pending_release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_NPM_PUBLISH: ${{ inputs.npm_version_already_published }}
        run: |
          release_args=(--ci --increment=minor --hooks.before:init= --no-git.requireCleanWorkingDir --npm.skipChecks)
          if [[ "$SKIP_NPM_PUBLISH" == "true" ]]; then
            release_args+=(--npm.publish=false)
          fi
          bunx release-it "${release_args[@]}"
